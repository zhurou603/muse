schema_version: muse.pretrain.s2.v1
seed: 42
stage: 2
deterministic: true
data:
  sources:
  - pubchem
  - chembl
  - pi1m
  - uniref50
  - pdb
  - natural_uniref50
  - natural_pdb
  - geom_drugs
  - qmugs
  - qm9
  mtr_norm: data/pretrain/targets/mtr_norm.json
  aux_targets: data/pretrain/targets/aux_targets.json
  scaffold_sampling: true
  unique_scaffolds: false
  source_grouped: true
  molecule3d: true
  domain_weights:
    small_molecule: 0.35
    polymer: 0.2
    bio: 0.45
  temperature: 0.005
model:
  d_model: 1024
  n_layers: 24
  n_heads: 16
  d_ffn: 2048
  num_experts: 8
  mole_every: 4
  embed_dim: 1024
  contrastive_dim: 256
  descriptor_dim: 208
  max_seq_len: 1024
  dropout: 0.1
training:
  lr: 0.0001
  warmup_steps: 300
  total_steps: 8000
  micro_batch: 32
  accumulation_steps: 4
  log_interval: 50
  checkpoint_interval: 1000
  grad_clip: 1.0
  bf16: true
  prefetch: 4
  mlm: true
  denoise: true
  align_2d3d: true
  weights:
    mlm: 1.0
    descriptor: 1.0
    denoise: 1.0
    energy: 1.0
    align: 1.0
