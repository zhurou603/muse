schema_version: muse.pretrain.acceptance.v1
seed: 42
status_values: [pending, in_progress, verified, blocked]
formal_defaults:
  from_scratch: true
  embed_dim: 1024
  effective_batch: 2048
  optimizer: adamw
  learning_rate: 0.0001
  warmup_steps: 10000
  schedule: cosine
  grad_clip: 1.0
  bf16: true
  scaffold_temperature: 0.005
  omc25_target_frames: 7000000
  omc25_z_threshold: 10.0
  s4_domain_weights:
    small_molecule: 0.40
    crystal: 0.25
    bio: 0.20
    polymer: 0.15
requirements:
  - id: data.external_corpora
    status: in_progress
    evidence: [data/pretrain/manifest/data_manifest.jsonl]
  - id: data.pubchem_descriptors
    status: verified
    evidence: [data/pretrain/descriptors/pubchem.desc.f32.npy, data/pretrain/descriptors/pubchem.keys.txt, data/pretrain/descriptors/pubchem.norm.json]
  - id: data.formal_mtr_norm
    status: verified
    evidence: [data/pretrain/targets/mtr_norm.json]
  - id: data.natural_peptides_le50
    status: in_progress
    evidence: [data/pretrain/index/natural_peptides.stats.json]
  - id: data.aux_exclusions
    status: verified
    evidence: [data/pretrain/audit, data/pretrain/targets/aux_targets.json]
  - id: data.shadow_properties_excluded
    status: verified
    evidence: [data/pretrain/manifest/shadow_properties.json, data/pretrain/targets/aux_targets.json]
  - id: data.qm9_qmugs_geom_3d
    status: verified
    evidence: [data/pretrain/index/molecule3d]
  - id: data.unique_3d_40m
    status: pending
    evidence: [data/pretrain/manifest/official_assets.json]
  - id: data.scaffold_sampling
    status: pending
    evidence: [data/pretrain/index]
  - id: data.omc25_parent_triple_audit
    status: verified
    evidence: [data/pretrain/audit/omc25-parent-recovery/summary.json, data/pretrain/audit/omc25-parent-recovery/prior_exclusions.jsonl]
  - id: data.omc25_7m_cache_stats
    status: verified
    evidence: [data/pretrain/index/omc25.sample.jsonl.report.json, data/pretrain/cache/omc25_frames/manifest.json, data/pretrain/targets/omc25_frame_stats.json]
  - id: data.throughput_and_1000_structure_review
    status: pending
    evidence: [data/pretrain/audit]
  - id: mask.sequence_15_80_10_10
    status: verified
    evidence: [model_design/tests/test_masking.py]
  - id: mask.atom_15_and_feature_sync
    status: verified
    evidence: [model_design/tests/test_batching.py]
  - id: mask.peptide_30_40_30_strict
    status: verified
    evidence: [model_design/tests/test_masking.py, data/pretrain/audit/cycpept.stats.json]
  - id: mask.denoise_sigma_noise_pair_drop
    status: verified
    evidence: [model_design/tests/test_batching.py]
  - id: preprocess.pi1m_five_views_dummy_atom
    status: verified
    evidence: [data/pretrain/index/pi1m_views.json]
  - id: preprocess.protein_crop_seed
    status: pending
    evidence: [model_design/tests/test_corpora.py]
  - id: preprocess.copolymer_composition_block_diagonal
    status: pending
    evidence: [model_design/tests/test_featurize.py]
  - id: preprocess.pbc_reference_and_truncation
    status: pending
    evidence: [model_design/tests/test_featurize.py, data/pretrain/audit]
  - id: preprocess.strict_no_fallback
    status: in_progress
    evidence: [model_design/muse_encoder/pretrain/dataset.py]
  - id: train.real_3d_and_crystal_sources
    status: in_progress
    evidence: [model_design/muse_encoder/pretrain/run_pretrain.py]
  - id: train.a_train_90_tasks_max_5pct
